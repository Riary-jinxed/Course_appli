name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances et tests
        run: |
          flutter pub get
          flutter test

      - name: Clé de signature (si configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/course.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/course.jks" >> "$GITHUB_ENV"
            echo "APK signé avec la clé du projet"
          else
            echo "::warning::Pas de clé configurée : APK signé avec une clé de debug (désinstaller avant chaque mise à jour)"
          fi

      - name: Compiler l'APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk course.apk

      - uses: actions/upload-artifact@v4
        with:
          name: course-apk
          path: course.apk

      # Publie l'APK dans la release "derniere-version", lien stable à partager :
      # https://github.com/<owner>/<repo>/releases/download/derniere-version/course.apk
      - name: Publier la release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build ${{ github.run_number }} · commit ${GITHUB_SHA::7} · $(date -u '+%d/%m/%Y %H:%M') UTC"
          if gh release view derniere-version >/dev/null 2>&1; then
            gh release upload derniere-version course.apk --clobber
            gh release edit derniere-version --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create derniere-version course.apk --title "Dernière version" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
